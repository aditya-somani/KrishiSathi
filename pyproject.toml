[project]
name = "krishisathi"
version = "0.1.0"
description = "KrishiSathi - Multilingual Voice Assistant for Indian Farmers powered by Gnani.ai and LiveKit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "livekit-agents[gnani,google,openai,silero,turn-detector]>=1.3",
    "livekit-plugins-gnani>=0.1.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

